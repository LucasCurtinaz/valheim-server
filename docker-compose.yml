services:
  valheim:
    image: lloesche/valheim-server
    container_name: valheim-server
    restart: unless-stopped
    ports:
      - "2456:2456/udp"
      - "2457:2457/udp"
      - "2458:2458/udp"
    environment:
      - SERVER_NAME=puxadores
      - WORLD_NAME=puxadores
      - SERVER_PASS=puxadores123
      - SERVER_PORT=2456
      - SERVER_PUBLIC=1
      - STEAMCMD_ARGS=validate
    volumes:
      - ./valheim/data:/config
      - ./valheim/server:/opt/valheim